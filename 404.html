<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found - AutoParts Store</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF6B00;
            --primary-dark: #E05E00;
            --primary-light: rgba(255, 107, 0, 0.15);
            --bg-dark: #0B0F19;
            --bg-card: rgba(15, 23, 42, 0.65);
            --text-main: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.7);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 40px 20px;
            position: relative;
        }

        /* Ambient Glowing Background Blobs */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        .bg-glow-1 {
            width: 500px;
            height: 500px;
            background: var(--primary);
            top: -10%;
            left: -10%;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            width: 600px;
            height: 600px;
            background: var(--primary-dark);
            bottom: -15%;
            right: -10%;
            animation: floatGlow 15s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        /* 404 Container Card */
        .error-card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 650px;
            background: var(--bg-card);
            border: 1.5px solid rgba(255, 107, 0, 0.25);
            border-radius: 32px;
            padding: 60px 40px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo Link */
        .logo-wrap {
            display: inline-block;
            margin-bottom: 40px;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .logo-wrap:hover {
            transform: scale(1.05);
        }

        .logo-img {
            height: 38px;
            object-fit: contain;
        }

        /* SVG Tachometer Gauge Visual */
        .gauge-wrap {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px auto;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            animation: gaugeShake 4s ease-in-out infinite;
        }

        @keyframes gaugeShake {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
        }

        .gauge-needle {
            transform-origin: 100px 100px;
            transform: rotate(135deg); /* Default rotation pointing to Redline */
            animation: needleBreathe 3s cubic-bezier(0.25, 0.8, 0.25, 1) infinite alternate;
        }

        @keyframes needleBreathe {
            0% { transform: rotate(120deg); }
            100% { transform: rotate(145deg); } /* Bounces into the Redline zone */
        }

        /* Content Text */
        .error-code-label {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .error-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #FFFFFF 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-message {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Interactive Buttons */
        .btn-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 100px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-primary {
            background: var(--primary);
            color: #FFFFFF;
            border: 1.5px solid var(--primary);
            box-shadow: 0 8px 24px rgba(255, 107, 0, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(255, 107, 0, 0.45);
        }

        .btn-primary svg {
            transition: transform 0.3s ease;
        }

        .btn-primary:hover svg {
            transform: translateX(3px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid rgba(255, 107, 0, 0.45);
        }

        .btn-secondary:hover {
            background: rgba(255, 107, 0, 0.08);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255, 107, 0, 0.15);
        }

        .btn-secondary svg {
            transition: transform 0.3s ease;
        }

        .btn-secondary:hover svg {
            transform: translateX(-3px);
        }

        /* Query param details */
        .email-capture-box {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 107, 0, 0.15);
            display: none;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .email-capture-title {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .email-capture-field {
            width: 100%;
            max-width: 320px;
            padding: 10px 18px;
            border-radius: 100px;
            border: 1.5px solid rgba(255, 107, 0, 0.25);
            background: rgba(15, 23, 42, 0.5);
            color: #FFFFFF;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            outline: none;
        }

        /* Responsive */
        @media (max-width: 580px) {
            .error-card {
                padding: 40px 20px;
            }
            .error-title {
                font-size: 1.9rem;
            }
            .btn-group {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Background Ambient Glows -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="error-card">
        <!-- Logo -->
        <a href="index.html" class="logo-wrap" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 40px;"><img src="assets/home/stackly logo orange.webp" alt="STACKLY Logo" class="logo-img"></a>

        <!-- Gauge Visual -->
        <div class="gauge-wrap">
            <svg class="gauge-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer Ring -->
                <circle cx="100" cy="100" r="85" stroke="rgba(255, 255, 255, 0.08)" stroke-width="8" />
                <!-- Speedometer Arc (0 to 8 RPM) -->
                <path d="M40 160 A85 85 0 1 1 160 160" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" stroke-linecap="round" />
                <!-- Redline Zone (7 to 8 RPM) -->
                <path d="M140 60 A85 85 0 0 1 160 160" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" />
                
                <!-- Tick Marks -->
                <!-- 0 RPM -->
                <line x1="43" y1="150" x2="53" y2="146" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" />
                <!-- 2 RPM -->
                <line x1="40" y1="90" x2="52" y2="92" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" />
                <!-- 4 RPM -->
                <line x1="100" y1="20" x2="100" y2="32" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" />
                <!-- 6 RPM -->
                <line x1="160" y1="90" x2="148" y2="92" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" />
                <!-- 8 RPM (Redline End) -->
                <line x1="157" y1="150" x2="147" y2="146" stroke="var(--primary)" stroke-width="2.5" />

                <!-- Digital Center Label -->
                <rect x="75" y="115" width="50" height="24" rx="4" fill="rgba(11, 15, 25, 0.8)" stroke="rgba(255, 107, 0, 0.2)" stroke-width="1" />
                <text x="100" y="132" fill="var(--primary)" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">404</text>
                <text x="100" y="152" fill="rgba(255,255,255,0.4)" font-family="var(--font-body)" font-size="8" font-weight="600" text-anchor="middle">RPM x 1000</text>

                <!-- Needle Pin Center -->
                <circle cx="100" cy="100" r="12" fill="#1E293B" stroke="var(--primary)" stroke-width="3" />
                
                <!-- Needle Dial -->
                <g class="gauge-needle">
                    <path d="M100 100 L150 48" stroke="var(--primary)" stroke-width="4.5" stroke-linecap="round" />
                    <circle cx="150" cy="48" r="3" fill="#FFFFFF" />
                </g>
            </svg>
        </div>

        <div class="error-code-label">Redline Hit</div>
        <h2 class="error-title">Page Drifted Off-Course</h2>
        <p class="error-message">
            The parts collection, custom ECU tune, or showroom page you are looking for has drifted out of bounds, is out of stock, or has been temporarily tuned out of our database.
        </p>

        <!-- Buttons group -->
        <div class="btn-group">
            <a href="index.html" class="btn btn-primary">
                Back to Showroom
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>

            <button onclick="window.history.back()" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Return to Track
            </button>
        </div>

        <!-- Query parameter email capture -->
        <div id="email-capture" class="email-capture-box">
            <div class="email-capture-title">Logged Client Email</div>
            <input id="emailField" class="email-capture-field" type="email" readonly>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var email = params.get('email');
            if (email) {
                var box = document.getElementById('email-capture');
                var field = document.getElementById('emailField');
                if (box && field) {
                    field.value = email;
                    box.style.display = 'block';
                }
            }
        })();
    </script>
</body>

</html>
